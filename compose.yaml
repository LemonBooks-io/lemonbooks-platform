services:
  postgres:
    image: postgres:17-alpine
    container_name: lemonbooks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lemonbooks
      POSTGRES_USER: lemonbooks
      POSTGRES_PASSWORD: lemonbooks
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - lemonbooks_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemonbooks -d lemonbooks"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lemonbooks_postgres_data:
